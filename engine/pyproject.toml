[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwapar"
version = "0.3.0"
description = "DWAPAR — An Experiment in Digital Civilization (Phase 1: the world)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dwapar = "dwapar.cli:main"

[tool.setuptools.packages.find]
include = ["dwapar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
