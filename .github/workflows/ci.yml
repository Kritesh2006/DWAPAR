name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e "engine[dev]"
      - name: pytest
        working-directory: engine
        run: python -m pytest -q --durations=10

  windows:
    name: Windows scripts + engine tests
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DWAPAR_NO_PAUSE: "1"
      DWAPAR_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: setup.bat (creates .venv, installs engine, builds dashboard)
        shell: cmd
        run: call setup.bat
      - name: Engine tests on Windows
        shell: cmd
        run: .venv\Scripts\python.exe -m pytest -q engine\tests
      - name: start-headless.bat runs one simulated day and saves a checkpoint
        shell: cmd
        run: |
          call start-headless.bat --days 1 --size 32 --seed 3
          if not exist data\dwapar.sqlite exit /b 1
      - name: start.bat launches the observatory and the API answers
        shell: pwsh
        run: |
          Start-Process -FilePath cmd.exe -ArgumentList '/c', 'start.bat', '--size', '32', '--port', '8765' -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/status -TimeoutSec 2; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "observatory did not answer" }
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.Content -notmatch "DWAPAR") { throw "dashboard not served" }
          "World $($r.world_id) seed $($r.seed) at $($r.calendar.label)"
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

  dashboard:
    name: Dashboard (types, unit, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: pip install -e "engine[dev]"
      - working-directory: dashboard
        run: npm ci
      - name: Type-check and build
        working-directory: dashboard
        run: npm run build
      - name: Unit tests (Vitest)
        working-directory: dashboard
        run: npm run test:unit
      - name: Install Chromium for Playwright
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, real engine)
        working-directory: dashboard
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: dashboard/test-results
          if-no-files-found: ignore
